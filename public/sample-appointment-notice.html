<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Appointment notice</title>
    <style>
      body {
        margin: 0;
        background: #f4efe4;
        color: #1d3d32;
        font: 32px/1.45 DejaVu Sans, Arial, sans-serif;
      }
      .card {
        margin: 48px;
        padding: 48px;
        min-height: 1000px;
        border: 4px solid #245c4a;
        background: #fffdf8;
      }
      h1 {
        font-size: 42px;
        letter-spacing: 0.04em;
        margin: 0 0 48px;
      }
      p { margin: 0 0 20px; }
      ul { margin: 0 0 48px; padding-left: 36px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>APPOINTMENT NOTICE</h1>
      <p>Your appointment is scheduled for</p>
      <p>October 15, 2026 at 10:30 AM.</p>
      <p>Please bring:</p>
      <ul>
        <li>Passport</li>
        <li>Proof of address</li>
      </ul>
      <p>Welcome Centre</p>
    </div>
  </body>
</html>
